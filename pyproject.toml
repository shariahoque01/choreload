[project]
name = "family-chores"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "django==5.2.17",
    "gunicorn>=26.2.0",
    "psycopg[binary]==3.2.*",
]

[dependency-groups]
dev = [
    "pytest==8.4.*",
    "pytest-django==4.14.*",
    "ruff==0.16.*",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Django's `startapp` scaffolding imports these for convenience even before
# a model/view/admin/test is written.
"*/models.py" = ["F401"]
"*/admin.py" = ["F401"]
"*/views.py" = ["F401"]
"*/tests.py" = ["F401"]
# Auto-generated by makemigrations — not hand-written, not worth reformatting.
"*/migrations/*.py" = ["E501"]

